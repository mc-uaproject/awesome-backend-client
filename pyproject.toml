[tool.poetry]
name = "awesome-backend-client"
version = "0.1.0"
description = "Awesome Backend Client"
authors = ["THEROER <theroer09@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/mc-uaproject/awesome-backend-client"
repository = "https://github.com/mc-uaproject/awesome-backend-client"
documentation = "https://github.com/mc-uaproject/awesome-backend-client/blob/main/README.md"
keywords = ["uaproject", "backend", "client", "api", "discord"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
packages = [
    {include = "awesome_backend_client"}
]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.28.1"
websockets = "^12.0"
pydantic-settings = "^2.7.1"
uaproject-backend-schemas = {git = "https://github.com/mc-uaproject/uaproject-backend-schemas.git", rev = "v2"}
awesome-errors = {git = "https://github.com/mc-uaproject/awesome-errors"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.0"
black = "^23.3.0"
mypy = "^1.0.0"
pre-commit = "^3.3.3"
ruff = "^0.11.13"
vulture = "^2.14"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
lint.select = ["E", "F", "W", "C", "I", "B", "TID", "UP"]
lint.ignore = ["B008"]
exclude = ["venv", "__pycache__", "versions"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.vulture]
exclude = ["*.ini", "Dockerfile", "*.lock", "*.toml"]
ignore_decorators = []
ignore_names = ["model_config"]
# make_whitelist = true
min_confidence = 80
paths = ["*"]
sort_by_size = true
# verbose = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"